    /**
     * Web Audio API Warning Chime Synthesizer
     * Plays a distinct two-tone caution chime or urgent triple-pulse alert for explicit missions.
     */
    function playWarningChime(type = 'explicit') {
      if (isMuted) return;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        if (type === 'explicit') {
          // Urgent 3-pulse warning chime (E5 -> C5 -> E5)
          const notes = [659.25, 523.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.13);

            gain.gain.setValueAtTime(0.001, now + idx * 0.13);
            gain.gain.exponentialRampToValueAtTime(0.28, now + idx * 0.13 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.13);
            osc.stop(now + idx * 0.13 + 0.13);
          });
        } else {
          // Soft 2-tone caution chime (A4 -> D5)
          const notes = [440, 587.33];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.16);

            gain.gain.setValueAtTime(0.001, now + idx * 0.16);
            gain.gain.exponentialRampToValueAtTime(0.2, now + idx * 0.16 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.18);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.16);
            osc.stop(now + idx * 0.16 + 0.19);
          });
        }
      } catch (err) {
        console.warn('Web Audio API unavailable:', err);
      }
    }

    /**
     * Render Filtered Mission List
     */
    function renderMissionList() {
      const selectedChapter = chapterFilter.value;
      const selectedStatus = statusFilter.value;

      const filtered = MISSIONS.filter(m => {
        const chapterMatch = selectedChapter === 'all' || m.chapter === selectedChapter;
        let statusMatch = true;
        if (selectedStatus === 'flagged') {
          statusMatch = m.status === 'explicit' || m.status === 'caution';
        } else if (selectedStatus !== 'all') {
          statusMatch = m.status === selectedStatus;
        }
        return chapterMatch && statusMatch;
      });

      filteredCountBadge.textContent = `${filtered.length} mission${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        missionListContainer.innerHTML = `
          <div class="rounded-2xl bg-vice-card border border-vice-border p-6 text-center text-sm text-zinc-400">
            No missions match the selected filters.
          </div>
        `;
        return;
      }

      missionListContainer.innerHTML = filtered.map(m => {
        const isCurrent = m.id === currentMissionId;
        const isCompleted = m.id < currentMissionId;

        let borderClass = 'border-vice-border hover:border-zinc-700';
        if (isCurrent) {
          borderClass = 'border-vice-cyan ring-1 ring-vice-cyan/40 bg-vice-elevated/90';
        } else if (m.status === 'explicit') {
          borderClass = 'border-rose-500/40 hover:border-rose-500/70';
        } else if (m.status === 'caution') {
          borderClass = 'border-amber-500/30 hover:border-amber-500/60';
        }

        return `
          <article data-mission-id="${m.id}"
            class="mission-item cursor-pointer rounded-2xl bg-vice-card border ${borderClass} p-3.5 sm:p-4 transition active:scale-[0.99] ${isCompleted && !isCurrent ? 'opacity-70' : ''}">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2 text-[11px] font-semibold text-zinc-400 mb-0.5">
                  <span class="font-bold ${isCurrent ? 'text-vice-cyan' : 'text-zinc-300'}">#${m.id}</span>
                  <span>•</span>
                  <span class="truncate">${m.chapter}</span>
                  ${isCurrent ? '<span class="px-1.5 py-0.2 rounded bg-vice-cyan/20 text-vice-cyan text-[10px] font-extrabold uppercase">Active</span>' : ''}
                  ${isCompleted ? '<span class="text-emerald-400 text-[10px] font-bold">✓ Done</span>' : ''}
                </div>
                <h3 class="text-sm sm:text-base font-bold text-white truncate">
                  ${m.title}
                </h3>
              </div>

              <div class="shrink-0">
                ${getStatusBadgeHTML(m.status)}
              </div>
            </div>

            ${m.instruction ? `
              <p class="mt-2.5 text-xs ${m.status === 'explicit' ? 'text-rose-200 bg-rose-950/40 border-rose-500/30' : 'text-amber-200 bg-amber-950/30 border-amber-500/25'} border rounded-xl px-3 py-2 leading-relaxed">
                ${m.instruction}
              </p>
            ` : ''}
          </article>
        `;
      }).join('');

      // Attach click handlers to jump directly to any mission
      document.querySelectorAll('.mission-item').forEach(el => {
        el.addEventListener('click', () => {
          const targetId = Number(el.getAttribute('data-mission-id'));
          selectMission(targetId, true);
        });
      });
    }

    /**
     * Select a mission by ID, update UI, and trigger chime if flagged
     */
    function selectMission(id, scrollToTop = false) {
      if (id < 1 || id > MISSIONS.length) return;
      currentMissionId = id;
      const mission = MISSIONS.find(m => m.id === currentMissionId);

      renderActiveMission();
      renderMissionList();

      if (mission && (mission.status === 'explicit' || mission.status === 'caution')) {
        playWarningChime(mission.status);
        const label = mission.status === 'explicit'
          ? `ALERT #${mission.id}: SKIP CUTSCENE (${mission.title})`
          : `CAUTION #${mission.id}: Mild/Background (${mission.title})`;
        showToast(label, mission.status);
      }

      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    /**

     */
    function saveState() {
      try {
        localStorage.setItem('gtavi_cleanplay_current_id', String(currentMissionId));
        localStorage.setItem('gtavi_cleanplay_muted', String(isMuted));
      } catch (e) {
        // Ignore storage errors
      }
    }

      if (isMuted) {
        soundOnIcon.classList.add('hidden');
        soundOffIcon.classList.remove('hidden');
      } else {
        soundOnIcon.classList.remove('hidden');
        soundOffIcon.classList.add('hidden');
      }
    }

      if (currentMissionId < MISSIONS.length) {
        selectMission(currentMissionId + 1, false);
        const activeEl = document.querySelector(`[data-mission-id="${currentMissionId}"]`);
        if (activeEl) {

      if (currentMissionId > 1) {
        selectMission(currentMissionId - 1, false);

        playWarningChime('caution');

        saveState();

      playWarningChime('explicit');
      showToast('Audio Alert Test: Explicit Mission Chime', 'explicit');
    });

    // Initialize Application
    window.addEventListener('DOMContentLoaded', () => {
      updateMuteUI();
      renderActiveMission();
      renderMissionList();
    });
  </script>
